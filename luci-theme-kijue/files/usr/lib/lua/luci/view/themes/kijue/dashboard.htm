<%#
KiJueWrt - 首页
-%>
<% local current_page = 'dashboard' %>
<%+themes/kijue/header%>

<svg width="0" height="0" style="position:absolute;">
    <defs>
        <linearGradient id="kijueRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
        </linearGradient>
    </defs>
</svg>

<div class="kijue-hero">
    <div class="kijue-card kijue-router-card">
        <div class="kijue-router-3d">
            <div class="kijue-router">
                <div class="kijue-wifi-wave"></div>
                <div class="kijue-antenna left"></div>
                <div class="kijue-antenna right"></div>
                <div class="kijue-router-body"></div>
            </div>
        </div>
        <div class="kijue-ring-wrapper">
            <svg class="kijue-ring-svg" viewBox="0 0 130 130">
                <circle class="kijue-ring-bg" cx="65" cy="65" r="55"></circle>
                <circle class="kijue-ring-progress" id="kijue-ring" cx="65" cy="65" r="55"
                    stroke-dasharray="345.58" stroke-dashoffset="100"></circle>
            </svg>
            <div class="kijue-ring-center">
                <div class="kijue-ring-status" id="kijue-ring-status">网络正常</div>
                <div class="kijue-ring-sub" id="kijue-ring-uptime">--</div>
            </div>
        </div>
        <div class="kijue-router-info">
            <div class="kijue-info-label">在线设备</div>
            <div class="kijue-info-value"><span id="kijue-devices">--</span><span class="kijue-info-unit"> 台</span></div>
            <div class="kijue-info-detail">
                <div class="kijue-detail-item">
                    <span class="kijue-detail-label">运行时间</span>
                    <span class="kijue-detail-value" id="kijue-uptime">--</span>
                </div>
                <div class="kijue-detail-item">
                    <span class="kijue-detail-label">活动连接</span>
                    <span class="kijue-detail-value" id="kijue-conns">--</span>
                </div>
                <div class="kijue-detail-item">
                    <span class="kijue-detail-label">CPU</span>
                    <span class="kijue-detail-value" id="kijue-cpu">--%</span>
                </div>
            </div>
        </div>
    </div>

    <div class="kijue-stats-group">
        <div class="kijue-card kijue-stat-card download">
            <div class="kijue-stat-icon blue">&#11015;</div>
            <div class="kijue-stat-info">
                <div class="kijue-stat-label">下载</div>
                <div class="kijue-stat-value"><span id="kijue-download">--</span><span class="kijue-stat-unit">Mbps</span></div>
            </div>
            <div class="kijue-stat-badge on"></div>
        </div>
        <div class="kijue-card kijue-stat-card upload">
            <div class="kijue-stat-icon orange">&#11014;</div>
            <div class="kijue-stat-info">
                <div class="kijue-stat-label">上传</div>
                <div class="kijue-stat-value"><span id="kijue-upload">--</span><span class="kijue-stat-unit">Mbps</span></div>
            </div>
            <div class="kijue-stat-badge on"></div>
        </div>
        <div class="kijue-card kijue-stat-card signal">
            <div class="kijue-stat-icon green">&#128246;</div>
            <div class="kijue-stat-info">
                <div class="kijue-stat-label">信号强度</div>
                <div class="kijue-stat-value"><span id="kijue-signal">--</span><span class="kijue-stat-unit">%</span></div>
            </div>
            <div class="kijue-signal-bars">
                <div class="kijue-signal-bar"></div>
                <div class="kijue-signal-bar"></div>
                <div class="kijue-signal-bar"></div>
                <div class="kijue-signal-bar"></div>
            </div>
        </div>
    </div>
</div>

<div class="kijue-card kijue-topology">
    <div class="kijue-topology-title">&#128200; 设备拓扑</div>
    <div class="kijue-topology-platform" id="kijue-topology">
        <div class="kijue-topology-floor"></div>
    </div>
</div>

<h2 class="kijue-section-title">&#128230; 常用应用 <span class="count" id="kijue-apps-count">--</span></h2>
<div class="kijue-grid" id="kijue-apps">
    <div class="kijue-card kijue-func-card">
        <div class="kijue-func-icon kijue-skeleton" style="width:52px;height:52px;"></div>
        <div class="kijue-skeleton" style="height:14px;width:60px;"></div>
    </div>
    <div class="kijue-card kijue-func-card">
        <div class="kijue-func-icon kijue-skeleton" style="width:52px;height:52px;"></div>
        <div class="kijue-skeleton" style="height:14px;width:60px;"></div>
    </div>
    <div class="kijue-card kijue-func-card">
        <div class="kijue-func-icon kijue-skeleton" style="width:52px;height:52px;"></div>
        <div class="kijue-skeleton" style="height:14px;width:60px;"></div>
    </div>
    <div class="kijue-card kijue-func-card">
        <div class="kijue-func-icon kijue-skeleton" style="width:52px;height:52px;"></div>
        <div class="kijue-skeleton" style="height:14px;width:60px;"></div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    KiJueTheme.init('dashboard');
});
</script>

<%+themes/kijue/footer%>
