name: KiJueWrt
on:
  workflow_dispatch:
  schedule:
    # 每周日凌晨 2 点（北京时间）自动编译，保持固件最新
    - cron: '0 18 * * 6'
env:
  IMM_REPO: https://github.com/immortalwrt/immortalwrt
  IMM_BRANCH: openwrt-24.10
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - name: 拉取本仓库配置脚本
        uses: actions/checkout@v4
      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison gawk gcc-multilib g++-multilib \
          gettext git libncurses-dev libssl-dev libelf-dev asciidoc help2man \
          python3-distutils python3-pyelftools rsync unzip zlib1g-dev file wget \
          upx-ucl qemu-utils ccache
      - name: 克隆 ImmortalWrt 源码
        run: |
          git clone --depth 1 -b ${{ env.IMM_BRANCH }} ${{ env.IMM_REPO }} openwrt
      - name: 缓存下载包 dl 目录（加速后续编译）
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: ${{ env.IMM_BRANCH }}-dl-${{ hashFiles('.config') }}
          restore-keys: |
            ${{ env.IMM_BRANCH }}-dl-
      - name: 执行 diy-part1.sh 添加feeds源+克隆Argon主题和OpenAppFilter
        run: |
          cd openwrt
          chmod +x ../diy-part1.sh
          ../diy-part1.sh
      - name: 导入.config 执行make defconfig
        run: |
          cd openwrt
          cp ../.config .config
          make defconfig
      - name: 执行diy-part2.sh（改名KiJueWrt、banner、默认中文argon主题、改IP主机名）
        run: |
          cd openwrt
          chmod +x ../diy-part2.sh
          ../diy-part2.sh
      - name: 下载全部源码包
        run: |
          cd openwrt
          make download -j8
      - name: 编译固件（内存不足自动降级单线程重试）
        run: |
          cd openwrt
          make -j$(nproc) || make -j1
      - name: 收集固件输出
        run: |
          mkdir -p ./artifacts
          cp -r openwrt/bin/targets/x86/64/* ./artifacts/ || true
      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          name: KiJueWrt-IMM-x86_64
          path: ./artifacts/
