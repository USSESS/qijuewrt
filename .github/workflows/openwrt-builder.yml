name: KiJueWrt
on:
  workflow_dispatch:
env:
  IMM_REPO: https://github.com/immortalwrt/immortalwrt
  IMM_BRANCH: openwrt-24.10
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - name: 拉取本仓库配置脚本
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison gawk gcc-multilib g++-multilib \
          gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: 清理磁盘空间（防止No space left）
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/lib/heroku
          sudo rm -rf /opt/hostedtoolcache
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "清理后磁盘空间："
          df -h

      - name: 克隆 ImmortalWrt 源码（24.10 稳定分支）
        run: |
          git clone --depth 1 -b ${{ env.IMM_BRANCH }} ${{ env.IMM_REPO }} openwrt

      - name: 缓存下载包 dl 目录（加速后续编译）
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: ${{ runner.os }}-imm2410-dl-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-imm2410-dl-

      - name: 执行 diy-part1.sh（添加feeds源+iStore+netwizard+ddns-go+kijue主题）
        run: |
          cd openwrt
          chmod +x ../diy-part1.sh
          ../diy-part1.sh

      - name: 导入 .config 配置，执行 diy-part2.sh（改名+中文修复+kijue主题+banner）
        run: |
          cd openwrt
          cp ../.config .config
          chmod +x ../diy-part2.sh
          ../diy-part2.sh
          make defconfig

      - name: 下载全部源码包
        run: |
          cd openwrt
          make download -j8

      - name: 编译固件
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: 收集固件输出
        run: |
          mkdir -p ./artifacts
          cp -r openwrt/bin/targets/x86/64/* ./artifacts/

      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          name: KiJueWrt-IMM2410-x86_64
          path: ./artifacts/
