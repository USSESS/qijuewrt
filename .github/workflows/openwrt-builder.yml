name: KiJueWrt
on:
  workflow_dispatch:

env:
  IMM_REPO: https://github.com/immortalwrt/immortalwrt
  IMM_BRANCH: master

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取本仓库配置脚本
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison gawk gcc-multilib g++-multilib \
          gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: 克隆 ImmortalWrt 源码
        run: |
          git clone --depth 1 -b ${{ env.IMM_BRANCH }} ${{ env.IMM_REPO }} openwrt
          cd openwrt

      - name: 执行 diy‑part1.sh 添加feeds源(iStore+你的edge主题)
        run: |
          cd openwrt
          chmod +x ../diy-part1.sh
          ../diy-part1.sh
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 导入.config配置，执行diy‑part2.sh（改名KiJueWrt、banner、默认主题）
        run: |
          cd openwrt
          cp ../.config .config
          chmod +x ../diy-part2.sh
          ../diy-part2.sh
          make defconfig

      - name: 下载全部源码包
        run: |
          cd openwrt
          make download -j8

      - name: 编译固件
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: 收集固件输出
        run: |
          mkdir -p ./artifacts
          cp -r openwrt/bin/targets/x86/64/* ./artifacts/

      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          name: KiJueWrt‑IMM‑x86_64
          path: ./artifacts/
